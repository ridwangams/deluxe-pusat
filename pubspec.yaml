name: deluxe_teriosh
description: Deluxe Teriosh Database App
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.4.0
  flutter_local_notifications: ^16.3.0
  http: ^1.1.0

flutter:
  uses-material-design: true  flutter_riverpod: ^3.1.0
  # Navigation
  go_router: ^17.0.1
  # Cache & Database
  shared_preferences: ^2.3.1
  # Generator and Annotations
  riverpod_annotation: ^4.0.0
  freezed_annotation: ^3.0.0
  # Media
  flutter_svg: ^2.0.10+1
  # Logging
  logger: ^2.4.0
  pretty_dio_logger: ^1.4.0
  # Serialization & Deserialization
  dart_mappable:
  # Networking
  retrofit: ^4.4.0
  dio: ^5.8.0+1
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner:
  custom_lint:
  flutter_guardian:
   path: packages/flutter_guardian/
  riverpod_generator:
  riverpod_lint:
  flutter_gen_runner:
  dart_mappable_builder:
  retrofit_generator: ^10.2.1
  freezed: ^3.0.6

flutter:
  uses-material-design: true
  generate: true


flutter_gen:
  output: lib/src/presentation/core/gen
  line_length: 80

  integrations:
    flutter_svg: true
